<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self Registered Students - Teacher Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="viewstudent.css">
<style>
  .student-type-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .tab-btn {
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    color: #475569;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .tab-btn:hover {
    background: #e2e8f0;
    color: #1e293b;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
    color: white;
    border-color: #7c3aed;
    box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
  }
  .badge-self {
    background: #e0e7ff;
    color: #4338ca;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
  }
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>

<body>
  <!-- Background Shapes -->
  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
  </div>

  <div class="container">
    <div class="content-wrapper">

      <!-- Header -->
      <div class="header">
        <div class="header-left">
          <div class="logo-icon-wrapper">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
          </div>
          <h1 class="page-title">Self Registered Students</h1>
        </div>
        <button class="nav-action-btn back-btn" onclick="window.location.href='teacherdashboard.html'">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"/>
            <path d="M12 19l-7-7 7-7"/>
          </svg>
          <span>Back to Dashboard</span>
        </button>
      </div>

      <!-- Filters Card -->
      <div class="filters-card">
        <h3 class="filters-title">Filter Self Registered Students</h3>
        <div class="filters-grid">
          <div class="filter-group">
            <label class="filter-label">Class / Year</label>
            <select id="yearFilter" class="filter-select">
              <option value="">All Years</option>
              <option value="FY">First Year (FY)</option>
              <option value="SY">Second Year (SY)</option>
              <option value="TY">Third Year (TY)</option>
              <option value="LY">Last Year (LY)</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Division</label>
            <select id="divisionFilter" class="filter-select">
              <option value="">All Divisions</option>
              <option value="A">Division A</option>
              <option value="B">Division B</option>
              <option value="C">Division C</option>
            </select>
          </div>
          <div class="filter-group">
            <label class="filter-label">Batch</label>
            <select id="batchFilter" class="filter-select">
              <option value="">All Batches</option>
              <option value="B1">Batch 1</option>
              <option value="B2">Batch 2</option>
              <option value="B3">Batch 3</option>
            </select>
          </div>
          <div class="filter-group">
            <button id="applyFilters" class="apply-btn">Apply Filters</button>
          </div>
        </div>
      </div>

      <!-- Students Table -->
      <div id="studentsContainer" class="students-container">
        <div class="loading">Loading self-registered students...</div>
      </div>

    </div>
  </div>

<script src="viewselfstudents.js"></script>
</body>
</html>
